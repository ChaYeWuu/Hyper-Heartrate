name: 发布到 Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签 (例如 1.3.0)'
        required: true
        type: string
      changelog:
        description: '更新日志 (支持 Markdown)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        module:
          - dir: fabric-26.2
            mc: "26.2"
            java: "25"
          - dir: fabric-26.1
            mc: "26.1"
            java: "25"
          - dir: fabric-1.21.11
            mc: "1.21.11"
            java: "21"
          - dir: fabric-1.21.6-1.21.10
            mc: 1.21.6-1.21.10
            java: "21"
          - dir: fabric-1.21.4-1.21.5
            mc: 1.21.4-1.21.5
            java: "21"
          - dir: fabric-1.21.1-1.21.3
            mc: 1.21.1-1.21.3
            java: "21"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.module.java }}
          distribution: 'temurin'

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: 构建 ${{ matrix.module.dir }}
        working-directory: ${{ matrix.module.dir }}
        run: chmod +x gradlew && ./gradlew clean build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.module.dir }}
          path: ${{ matrix.module.dir }}/build/libs/hyper-heartrate-*.jar
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true

      - name: 列出要上传的文件
        run: ls -la hyper-heartrate-*.jar | grep -v sources

      - name: 发布到 Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ secrets.MODRINTH_PROJECT_ID }}
          version: ${{ github.event.release.tag_name || inputs.tag }}
          changelog: ${{ github.event.release.body || inputs.changelog }}
          loaders: fabric
          game-versions: |
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.1
            26.2
          files: hyper-heartrate-*.jar